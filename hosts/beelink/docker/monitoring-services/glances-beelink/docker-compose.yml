services:

  ###########################################################
  # Glances Beelink
  ###########################################################
  glances-beelink:
    image: nicolargo/glances:4.5.8-full
    container_name: glances-beelink
    restart: unless-stopped
    environment:
      GLANCES_OPT: -w
      TZ: ${TZ}
    ports:
      - 127.0.0.1:61209:61208
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/host/root:ro
      - /srv/storage:/host/sata:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:61208/api/4/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+-full$$
      wud.tag.transform: ^(\d+\.\d+\.\d+)-full$$ => $$1
      wud.link.template: https://github.com/nicolargo/glances/releases/tag/v$${major}.$${minor}.$${patch}
      wud.trigger.include: dockercompose.local,telegram.local
    pid: host

