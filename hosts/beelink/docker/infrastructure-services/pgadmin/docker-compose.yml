services:

  ###########################################################
  # Pgadmin
  ###########################################################
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: '[''oauth2'']'
      PGADMIN_CONFIG_OAUTH2_CONFIG: |-
        [{'OAUTH2_NAME': 'authentik',
          'OAUTH2_DISPLAY_NAME': 'Authentik',
          'OAUTH2_CLIENT_ID': '${PGADMIN_OIDC_CLIENT_ID}',
          'OAUTH2_CLIENT_SECRET': '${PGADMIN_OIDC_CLIENT_SECRET}',
          'OAUTH2_SERVER_METADATA_URL': '${OAUTH2_SERVER_METADATA_URL}',
          'OAUTH2_SCOPE': 'openid email profile',
          'OAUTH2_USERNAME_CLAIM': 'email',
          'OAUTH2_AUTO_CREATE_USER': False}]
      PGADMIN_CONFIG_OAUTH2_AUTO_LOGIN: 'True'
    ports:
      - 127.0.0.1:5050:80
    networks:
      - database-admin-network
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test:
        - CMD
        - wget
        - -O
        - '-'
        - http://127.0.0.1:80/misc/ping
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.link.template: https://www.pgadmin.org/docs/pgadmin4/$${major}.$${minor}/release_notes_$${major}_$${minor}.html
      wud.trigger.include: dockercompose.local,telegram.local

###########################################################
# Shared Configuration
###########################################################
networks:
  database-admin-network:
    external: true
    name: database-admin-network
