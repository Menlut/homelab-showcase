services:

  ###########################################################
  # Portainer
  ###########################################################
  # Docker socket access and the existing portanierdata directory are required.
  portainer:
    image: portainer/portainer-ee:2.45.3-alpine
    container_name: portainer
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9443:9443
    # Preserve privileged Docker access and existing bind mounts.
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portanier-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:9000/api/system/status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+-alpine$$
      wud.link.changelog: https://docs.portainer.io/sts/release-notes
      wud.link.doc: https://docs.portainer.io/release-notes
      wud.trigger.include: dockercompose.local,telegram.local

