services:

  ###########################################################
  # Adguardhome
  ###########################################################
  # Keep host networking and the existing AdGuard DNS filtering rules.
  adguardhome:
    image: adguard/adguardhome:v0.107.80
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./adguard-work:/opt/adguardhome/work
      - ./adguard-conf:/opt/adguardhome/conf
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^v\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/AdguardTeam/AdGuardHome/releases/tag/v$${major}.$${minor}.$${patch}
      wud.trigger.include: dockercompose.local,telegram.local

