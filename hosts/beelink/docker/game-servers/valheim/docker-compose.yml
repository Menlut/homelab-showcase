services:

  ###########################################################
  # Valheim Server
  ###########################################################
  # Preserve world, overrides, hooks, and all published game ports.
  valheim:
    image: ghcr.io/community-valheim-tools/valheim-server:1.4.1
    container_name: valheim-server
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SERVER_PORT: ${VALHEIM_PORT_1}
      BEPINEX: 'true'
      PRE_SERVER_RUN_HOOK: /bin/sh /overrides/pre-server-run.sh
    env_file:
      - .env
    ports:
      - ${VALHEIM_PORT_1}:${VALHEIM_PORT_1}/udp
      - ${VALHEIM_PORT_2}:${VALHEIM_PORT_2}/udp
      - ${VALHEIM_PORT_3}:${VALHEIM_PORT_3}/udp
    volumes:
      - ${HOST_PROJECT_DIR}/config:/config
      - ${HOST_PROJECT_DIR}/data:/opt/valheim
      - ${HOST_PROJECT_DIR}/overrides:/overrides:ro
    cap_add:
      - SYS_NICE
    healthcheck:
      test:
        - CMD-SHELL
        - supervisorctl status valheim-server | grep -q "RUNNING"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/community-valheim-tools/valheim-server-docker/releases/tag/v$${major}.$${minor}.$${patch}
      wud.trigger.include: dockercompose.local,telegram.local

  ###########################################################
  # Vikinger Panel
  ###########################################################
  # Vikinger requires Docker control and the existing Valheim project mount.
  panel:
    image: ghcr.io/viniciuspetrachin/vikinger-panel:2.1.19
    container_name: vikinger-panel
    restart: unless-stopped
    working_dir: /app
    environment:
      VALHEIM_PANEL_ROOT: ${HOST_PROJECT_DIR}
      PANEL_UID: ${PUID}
      PANEL_GID: ${PGID}
      DOCKER_GID: ${DOCKER_GID}
      PANEL_DEFAULT_LOCALE: ${PANEL_DEFAULT_LOCALE}
      PANEL_PORT: ${PANEL_PORT}
      PANEL_RCON_TIMEOUT: ${PANEL_RCON_TIMEOUT}
      PANEL_RCON_TIMEOUT_SLOW: ${PANEL_RCON_TIMEOUT_SLOW}
      PANEL_RCON_IDLE_SLOW: ${PANEL_RCON_IDLE_SLOW}
    ports:
      - 127.0.0.1:${PANEL_PORT}:8080
    # Preserve privileged Docker access and existing bind mounts.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_DIR}:${HOST_PROJECT_DIR}
    group_add:
      - ${DOCKER_GID}
    depends_on:
      valheim:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/viniciuspetrachin/vikinger-panel/releases/tag/v$${major}.$${minor}.$${patch}
      wud.trigger.include: dockercompose.local,telegram.local

  ###########################################################
  # Valheim RCON Updater
  ###########################################################
  rcon-updater:
    image: python:3.13.18-slim-bookworm
    container_name: valheim-rcon-updater
    restart: unless-stopped
    command:
      - python
      - /app/update-rcon.py
    user: ${PUID}:${PGID}
    volumes:
      - ${HOST_PROJECT_DIR}/scripts/update-rcon.py:/app/update-rcon.py:ro
      - ${HOST_PROJECT_DIR}/overrides/rcon:/rcon-cache
    # Process-liveness only; this does not prove update success.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import pathlib,sys; sys.exit(0 if b"update-rcon.py" in pathlib.Path("/proc/1/cmdline").read_bytes() else 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^3\.13\.\d+-slim-bookworm$$
      wud.tag.transform: ^(\d+\.\d+\.\d+)-slim-bookworm$$ => $$1
      wud.link.template: https://www.python.org/downloads/release/python-$${major}$${minor}$${patch}/
      wud.trigger.include: dockercompose.local,telegram.local

