      media-gluetun:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8990/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.watch.digest: 'true'
      wud.link.template: https://github.com/linuxserver/docker-sonarr/releases
      wud.trigger.include: dockercompose.local,telegram.local

  ###########################################################
  # Bazarr 4K
  ###########################################################
  bazarr-4k:
    image: linuxserver/bazarr:1.6.1
    container_name: bazarr-4k
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    network_mode: service:media-gluetun
    volumes:
      - ./4k-bazarrconfig:/config
      - ${MEDIA_PATH}:/media
