      media-gluetun:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sS -o /dev/null --max-time 5 http://127.0.0.1:6768/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1250m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.watch.digest: 'true'
      wud.link.template: https://github.com/morpheus65535/bazarr/releases/tag/v$${major}.$${minor}.$${patch}
      wud.trigger.include: dockercompose.local,telegram.local

