      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d+\.\d+\.\d+$$
      wud.watch.digest: 'true'
      wud.link.template: https://github.com/Sonarr/Sonarr/releases
      wud.trigger.include: dockercompose.local,telegram.local

  ###########################################################
  # Bazarr Optimized
  ###########################################################
  bazarr-optimized:
    image: linuxserver/bazarr:1.6.1
    container_name: bazarr-optimized
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
