services:

  ###########################################################
  # Media Fileflows
  ###########################################################
  media-fileflows:
    image: revenz/fileflows:26.09
    container_name: media-fileflows
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - 127.0.0.1:${FILEFLOWS_WEB_PORT}:5000/tcp
    volumes:
      - ./media-fileflowsdata:/app/Data
      - ./media-fileflowstemp:/temp
      - ${MEDIA_PATH}:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID}
      - ${RENDER_GID}
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:5000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      wud.watch: 'true'
      wud.tag.include: ^\d{2}\.\d{2}$$
      wud.tag.transform: ^(\d{2})\.(\d{2})$$ => $$1.$$2.0
      wud.watch.digest: 'true'
      wud.link.template: https://fileflows.com/docs/versions
      wud.trigger.include: dockercompose.local,telegram.local

